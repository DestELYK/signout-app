services:
  mariadb:
    container_name: mariadb
    image: mariadb
    restart: always
    ports:
      - "127.0.0.1:3306:3306"
    environment:
      - MARIADB_RANDOM_ROOT_PASSWORD=1
      - MYSQL_DATABASE=app
      - MYSQL_USER=signout-app
      - MYSQL_PASSWORD=mypassword
      - TZ=America/Toronto
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mariadb-admin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  app:
    container_name: signout-app
    image: signout.app:5000/signout-app:latest
    restart: always
    user: 110:114
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      mariadb:
        condition: service_healthy
        restart: true
        required: true
    environment:
      - DATABASE_URL=mysql://signout-app:mypassword@mariadb:3306/app
      - PROFILE_URL="https://sjkschool.myschoolapp.com/app/faculty#profile/"
      - REPORT_URL="https://docs.google.com/forms/d/e/1FAIpQLSdlh_Jkl2na-ZYe0uSICr4klv3rTM4OhrX-TK59AzTiCi_E2w/viewform?embedded=true"
      - TZ=America/Toronto
    command: ["/bin/sh", "-c", "npx prisma migrate deploy && npm run start"]
    healthcheck:
      test: curl --fail http://localhost:3000/api/health-check || exit 1
      interval: 60s
      timeout: 30s
      retries: 3
      start_period: 60s

volumes:
  mariadb_data:
    name: mariadb_data
    driver: local
