services:
  mariadb:
    container_name: mariadb
    image: mariadb
    restart: always
    environment:
      MARIADB_RANDOM_ROOT_PASSWORD: 1
      MYSQL_DATABASE: app
      MYSQL_USER: signout-app
      MYSQL_PASSWORD: mypassword
    volumes:
      - mariadb_data:/var/lib/mysql

  app:
    container_name: signout-app
    image: signout.app:5000/signout-app:latest
    restart: always
    user: 110:114
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - mariadb
    environment:
      - DATABASE_URL=mysql://signout-app:mypassword@mariadb:3306/app
    command: ["/bin/sh", "-c", "npx prisma migrate deploy && npm run start"]

volumes:
  mariadb_data:
    name: mariadb_data
    driver: local