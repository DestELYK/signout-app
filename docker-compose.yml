services:
  mariadb:
    container_name: mariadb
    image: mariadb
    restart: always
    environment:
      MARIADB_RANDOM_ROOT_PASSWORD: 1
      MYSQL_DATABASE: app
      MYSQL_USER: signout-app
      MYSQL_PASSWORD: mypassword
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  app:
    container_name: signout-app
    image: signout.app:5000/signout-app:latest
    restart: always
    user: 110:114
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - mariadb
    environment:
      - DATABASE_URL=mysql://signout-app:mypassword@mariadb:3306/app
    command: ["/bin/sh", "-c", "npx prisma migrate deploy && npm run start"]        
    healthcheck:
      test: curl --fail http://localhost:3000/api/health-check || exit 1
      interval: 60s
      timeout: 30s
      retries: 3
      start_period: 60s

volumes:
  mariadb_data:
    name: mariadb_data
    driver: local