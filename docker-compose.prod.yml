services:
  mariadb:
    container_name: mariadb
    image: mariadb
    restart: always
    env_file: .env.production
    ports:
      - "127.0.0.1:3306:3306"
    environment:
      - TZ=America/Toronto
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mariadb-admin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  app:
    container_name: signout-app
    build:
      context: .
      dockerfile: Dockerfile
      tags:
        - signout-app
        - signout-app:latest
        - signout-app:0.1.0
    user: 110:114
    restart: "on-failure"
    ports:
      - "127.0.0.1:3100:3000"
    depends_on:
      - mariadb
    env_file: .env.production
    environment:
      - TZ=America/Toronto
    command: ["/bin/sh", "-c", "npx prisma migrate deploy && npm run start"]        
    healthcheck:
      test: curl --fail http://localhost:3000/api/health-check || exit 1
      interval: 60s
      timeout: 30s
      retries: 3
      start_period: 60s

volumes:
  mariadb_data:
    name: mariadb_data
    driver: local