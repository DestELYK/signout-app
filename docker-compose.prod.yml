name: signout-app

services:
  mariadb:
    container_name: mariadb
    image: mariadb:11.2
    restart: always
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_DATABASE=signout_app
      - MYSQL_USER=signout-app
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - TZ=America/Toronto
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      start_period: 10s
      interval: 10s
      timeout: 5s
      retries: 3

  app:
    container_name: signout-app
    build:
      context: .
      dockerfile: Dockerfile
      tags:
        - signout-app
        - signout-app:latest
        - signout-app:1.0.0
    user: "${UID:-1000}:${GID:-1000}"
    restart: "on-failure"
    ports:
      - "127.0.0.1:3100:3000"
    depends_on:
      mariadb:
        condition: service_healthy
        restart: true
        required: true
    environment:
      - DATABASE_URL=mysql://signout-app:${MYSQL_PASSWORD}@mariadb:3306/signout_app
      - TZ=America/Toronto
    command: ["/bin/sh", "-c", "npx prisma migrate deploy && npm run start"]
    healthcheck:
      test: curl --fail http://localhost:3000/api/health-check || exit 1
      interval: 60s
      timeout: 30s
      retries: 3
      start_period: 60s

volumes:
  mariadb_data:
